meters:
- name: vm_gpu_hours
  description: GPU-hours consumed by on-demand virtual machines, billed per GPU-hour.
  unit: gpu_hours
  aggregation: sum
  dimensions:
  - organization
  - location
  - gpu_type
- name: baremetal_gpu_hours
  description: GPU-hours consumed by bare-metal rentals (multiples of eight GPUs), billed per GPU-hour.
  unit: gpu_hours
  aggregation: sum
  dimensions:
  - organization
  - location
  - gpu_type
- name: reserved_gpu_hours
  description: GPU-hours under Long-Term Reserve commitments at negotiated rates.
  unit: gpu_hours
  aggregation: sum
  dimensions:
  - organization
  - contract
  - gpu_type
- name: storage_gb_hours
  description: Shared storage allocated and billed per GB-hour.
  unit: gb_hours
  aggregation: sum
  dimensions:
  - organization
  - storage_volume
principles:
- name: Visibility
  description: Pull live rates from GET /billing/hourly-rate and GET /storage/hourly-rate; export transactions via /billing/transactions and monthly reports.
- name: Allocation
  description: Tag VMs, bare-metal rentals, and storage volumes by name and map organization transactions to internal cost centers.
- name: Optimization
  description: Stop or terminate idle VMs and bare-metal nodes, right-size GPU counts (multiples of eight), and move steady workloads to Long-Term Reserve to lower per-GPU-hour cost.
- name: Accountability
  description: Assign owners per rental and review monthly billing reports against budget; enable low-balance email alerts at the organization level.
