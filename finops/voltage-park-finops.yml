description: >-
  FinOps view of Voltage Park GPU cloud spend. Voltage Park bills a per-GPU-hour
  usage model for on-demand virtual machines and bare-metal rentals, a separate
  per-GB-hour rate for shared storage, and negotiated per-GPU-hour rates for
  Long-Term Reserve clusters. Pricing is positioned with no hidden ingress,
  egress, or support fees. The API exposes the customer's live combined hourly
  rate (GET /billing/hourly-rate), storage rate (GET /storage/hourly-rate), and
  historical and monthly transaction logs for cost allocation.
notes: >-
  Public per-GPU-hour rates are limited to the advertised $1.99/GPU-hour H100
  on-demand floor; Infiniband on-demand, H200, and reserved rates are
  "contact for pricing." Reconcile actual unit costs from authenticated billing
  endpoints or invoices.
