name: Voltage Park
kind: company
description: Voltage Park is a GPU cloud offering on-demand and reserved NVIDIA H100
  and H200 clusters as bare metal and virtual machines. Its On-Demand API (served at
  cloud-api.voltagepark.com, running on TensorDock infrastructure) lets developers
  deploy and manage instant VMs, bare-metal GPU rentals, SSH keys, shared storage,
  and billing programmatically with bearer-token authentication.
